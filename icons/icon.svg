<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3d6"/>
      <stop offset="0.5" stop-color="#d8c4f7"/>
      <stop offset="1" stop-color="#9fd8f7"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff2f8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#74285f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- fundo em tela cheia (serve também como ícone "maskable") -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- brilhos -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="80" cy="96" r="6"/><circle cx="440" cy="76" r="5"/><circle cx="420" cy="430" r="6"/>
    <circle cx="70" cy="400" r="5"/><circle cx="250" cy="52" r="4"/><circle cx="470" cy="250" r="4"/>
  </g>
  <g fill="#ffd76a">
    <path d="M400 130 Q400 152 422 152 Q400 152 400 174 Q400 152 378 152 Q400 152 400 130Z"/>
    <path d="M118 330 Q118 346 134 346 Q118 346 118 362 Q118 346 102 346 Q118 346 118 330Z"/>
  </g>
  <!-- ondas do clique -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="232" cy="176" r="86" stroke-width="10" opacity="0.7" stroke-dasharray="4 26"/>
    <circle cx="232" cy="176" r="128" stroke-width="8" opacity="0.4" stroke-dasharray="4 30"/>
  </g>
  <!-- cursor do mouse -->
  <g filter="url(#sh)">
    <path d="M176 118 L176 372 L244 306 L290 412 L342 390 L296 286 L392 286 Z"
          fill="url(#arrow)" stroke="#e0559b" stroke-width="16" stroke-linejoin="round"/>
  </g>
</svg>
