<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3d6"/>
      <stop offset="0.5" stop-color="#d8c4f7"/>
      <stop offset="1" stop-color="#9fd8f7"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff2f8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#74285f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- fundo em tela cheia (serve também como ícone "maskable") -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- brilhos -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="80" cy="96" r="6"/><circle cx="440" cy="76" r="5"/><circle cx="420" cy="430" r="6"/>
    <circle cx="70" cy="400" r="5"/><circle cx="250" cy="52" r="4"/><circle cx="470" cy="250" r="4"/>
  </g>
  <g fill="#ffd76a">
    <path d="M400 120 Q400 142 422 142 Q400 142 400 164 Q400 142 378 142 Q400 142 400 120Z"/>
    <path d="M108 340 Q108 356 124 356 Q108 356 108 372 Q108 356 92 356 Q108 356 108 340Z"/>
  </g>
  <!-- ondas do toque ao redor da ponta do dedo -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="256" cy="128" r="80" stroke-width="10" opacity="0.7" stroke-dasharray="4 26"/>
    <circle cx="256" cy="128" r="120" stroke-width="8" opacity="0.4" stroke-dasharray="4 30"/>
  </g>
  <!-- mão com dedo indicador apontando para cima -->
  <g filter="url(#sh)">
    <!-- dedo indicador -->
    <rect x="232" y="92" width="48" height="200" rx="24" fill="url(#skin)" stroke="#e0559b" stroke-width="10" stroke-linejoin="round"/>
    <!-- unha (destaque claro no topo) -->
    <rect x="240" y="96" width="32" height="28" rx="16" fill="#fff" opacity="0.5"/>
    <!-- palma -->
    <rect x="196" y="278" width="120" height="100" rx="40" fill="url(#skin)" stroke="#e0559b" stroke-width="10" stroke-linejoin="round"/>
    <!-- polegar (para a direita) -->
    <rect x="300" y="296" width="56" height="36" rx="18" fill="url(#skin)" stroke="#e0559b" stroke-width="8"/>
    <!-- dedos dobrados (três bolinhas embaixo da palma) -->
    <circle cx="222" cy="388" r="18" fill="url(#skin)" stroke="#e0559b" stroke-width="8"/>
    <circle cx="256" cy="394" r="18" fill="url(#skin)" stroke="#e0559b" stroke-width="8"/>
    <circle cx="290" cy="388" r="18" fill="url(#skin)" stroke="#e0559b" stroke-width="8"/>
  </g>
</svg>
